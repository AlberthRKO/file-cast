name: file_cast
description: FILE CAST EVIDENCIAS
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  # image 4.11.1 (requerido por pdfrx_engine) usa ZLibDecoder.decodeLazy,
  # disponible a partir de archive 4.4.0.
  archive: 4.4.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  dropdown_button2: ^2.3.9
  expandable: ^5.0.1
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  # 6.1.5 recursa en AndroidInternalStoragePathHandler.toMap al abrir Office.
  # 6.2.0-beta.3 incluye la corrección y conserva soporte para iOS 14.
  flutter_inappwebview: 6.2.0-beta.3
  flutter_pdfview: 1.4.5
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.3
  file_picker: ^8.1.7
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  http: ^1.6.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  image: 4.11.1
  just_audio: 0.10.6
  latlong2: ^0.9.1
  json_annotation: ^4.9.0
  lottie: 3.3.2
  media_kit: 1.2.6
  # Alineado con el reproductor media_kit incluido para Android.
  media_kit_video: 2.0.1
  modal_bottom_sheet: ^3.0.0
  offline_document_viewer:
    path: third_party/offline_document_viewer
  path_provider: ^2.1.6
  percent_indicator: ^4.2.4
  pinput: ^5.0.1
  provider: ^6.1.5+1
  permission_handler: ^11.4.0
  searchfield: ^0.9.9
  smart_auth: ^3.2.0
  sqflite_sqlcipher: ^3.4.1
  url_launcher: ^6.3.3
  video_player_media_kit: ^2.0.0
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: 1.1.4
  wakelock_plus: 1.3.2
  video_player: 2.10.1
  workmanager: ^0.9.3
  xml: 6.6.1

dev_dependencies:
  build_runner: ^2.10.5
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.4
  json_serializable: ^6.11.4
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

# sqflite_sqlcipher 3.4.1 todavía usa la API de opciones anterior de
# sqflite_common. Desde sqflite_common 2.5.8 la recuperación de una
# transacción abierta hace un cast a SqfliteOpenDatabaseOptions, incompatible
# con SqfliteSqlCipherOpenDatabaseOptions. Mantener la última versión anterior
# a ese cambio evita que una base recuperada falle al abrirse offline.
dependency_overrides:
  sqflite_common: 2.5.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/illustrations/
    # common assets
    - assets/common/logos/
    - docs/OFFICE_VIEWER_THIRD_PARTY_NOTICES.md

    # cliente1
    - assets/cliente1/logos/

    # cliente2
    - assets/cliente2/logos/

    # scrcpy server
    - assets/scrcpy/scrcpy-server-v2.7.jar
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-ExtraLight.ttf
          weight: 100
